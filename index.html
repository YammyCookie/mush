<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A personal portfolio of photographs by mush.">
  <title>mush — Photography</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/style.css?v=white1">
  <script defer src="./assets/gallery.js?v=portfolio1"></script>
</head>
<body>
  <a class="skip" href="#photographs">Skip to photographs</a>
  <div class="layout">
    <header>
      <h1><a href="./" aria-label="mush home">mush</a></h1>
      <nav id="albums" aria-label="Photograph collections"></nav>
      <div class="controls" id="tools" hidden>
        <div class="paging" id="paging"><button id="previous" aria-label="Previous photograph">Prev</button><span aria-hidden="true">/</span><button id="next" aria-label="Next photograph">Next</button></div>
        <button id="mode" aria-controls="photographs" aria-pressed="false">Show thumbnails</button>
        <button id="shuffle" hidden>Shuffle</button>
      </div>
    </header>
    <main id="photographs" tabindex="-1">
      <p id="status" role="status">Loading photographs…</p>
      <figure id="feature" hidden>
        <button id="enlarge" class="stage" aria-label="Enlarge photograph"><img id="print" alt=""></button>
        <figcaption><span id="caption"></span><span id="count" aria-live="polite"></span></figcaption>
      </figure>
      <div id="grid" aria-label="Photograph thumbnails" hidden></div>
    </main>
  </div>
  <dialog id="viewer" aria-label="Enlarged photograph">
    <button id="close">Close ×</button>
    <img id="large" alt="">
    <div class="dialog-footer"><span id="large-caption"></span><div class="paging"><button id="back" aria-label="Previous enlarged photograph">Prev</button> / <button id="forward" aria-label="Next enlarged photograph">Next</button></div></div>
  </dialog>
</body>
</html>
